name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            **/nuget.config

      - name: Restore
        run: dotnet restore SzereloMuhely/SzereloMuhely.slnx

      - name: Build (Release)
        run: dotnet build SzereloMuhely/SzereloMuhely.slnx --no-restore -c Release

      - name: Test (Release)
        run: dotnet test SzereloMuhely/SzereloMuhely.slnx --no-build -c Release
